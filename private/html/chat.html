<!DOCTYPE html>
<html>
  <head>
    <title id="title">Whiskers | Chat</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="og:title" content="Whiskers | Chat" />
    <meta name="og:description" content="Chat room hosted on Whiskers" />
    <meta name="og:image" content="/media/image/icons/logo.png" />
    <link rel="icon" type="image/png" href="/media/image/icons/logo.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/prism.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <nav>
      <a id="home" href="/" title="Home">
        <btn style="--img: url(/media/image/icons/logo.png)"></btn>
        Whiskers
      </a>
      <div>
        <btn
          style="--img: url(/media/image/icons/github.png)"
          onclick='goto("https://github.com/QueenAka/whiskers")'
          title="Source Code"></btn>
        <btn
          style="--img: url(/media/image/icons/downloads.png)"
          onclick='goto("/pages/downloads")'
          title="Downloads"></btn>
        <btn
          style="--img: url(/media/image/icons/license.png)"
          onclick='goto("/pages/license")'
          title="License and Agreements"></btn>
        <btn
          style="--img: url(/media/image/icons/settings.png)"
          onclick="goto('/pages/settings')"
          title="Settings"></btn>
        <pfp title="You" onclick="goto('/pages/settings')">
          <img src="/media/image/icons/profile.png" id="profileNav" />
        </pfp>
      </div>
    </nav>
    <div id="log"></div>
    <div class="bottom-nav" id="bottom-nav">
      <div
        placeholder="Send a message..."
        id="msginp"
        type="text"
        role="textbox"
        contenteditable
        tabindex="0"></div>
      <div class="icons">
        <div
          onclick="emojiList()"
          class="icon"
          style="--img: url('/media/image/icons/emoji.png')"></div>
        <div
          onclick="uploadMedia()"
          class="icon"
          style="--img: url('/media/image/icons/add.png')"></div>
        <div
          onclick="send()"
          class="icon"
          style="--img: url('/media/image/icons/send.png')"></div>
      </div>
      <input
        style="display: none"
        type="file"
        accept="audio/* image/* video/*"
        id="uploadMedia" />
    </div>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="/js/all.js"></script>
    <script src="/js/msg.js"></script>
    <script src="/js/prism.js"></script>
  </body>
</html>
